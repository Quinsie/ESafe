name: esafe

x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile
  target: runtime
  args:
    ESAFE_BUILD_COMMIT: ${ESAFE_BUILD_COMMIT:-unknown}

x-document-build: &document-build
  context: .
  dockerfile: backend/document_runtime/Dockerfile
  target: runtime
  args:
    ESAFE_BUILD_COMMIT: ${ESAFE_BUILD_COMMIT:-unknown}

x-backend-common: &backend-common
  image: esafe-backend:${ESAFE_APP_VERSION:-dev}
  build: *backend-build
  restart: unless-stopped
  init: true
  user: "${ESAFE_HOST_UID:-1001}:${ESAFE_HOST_GID:-1001}"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m

x-importer-common: &importer-common
  image: esafe-importer:${ESAFE_APP_VERSION:-dev}
  build:
    context: .
    dockerfile: infra/importer/Dockerfile
    target: runtime
  profiles: ["tools"]
  restart: "no"
  init: true
  user: "${ESAFE_HOST_UID:-1001}:${ESAFE_HOST_GID:-1001}"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m
  volumes:
    - ./storage/reference:/reference:ro

x-api-healthcheck: &api-healthcheck
  test:
    - CMD
    - python
    - -c
    - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)
  interval: 15s
  timeout: 5s
  start_period: 20s
  retries: 5

services:
  db-live:
    image: esafe-database:${ESAFE_APP_VERSION:-dev}
    build:
      context: .
      dockerfile: infra/database/Dockerfile
    restart: unless-stopped
    shm_size: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${LIVE_DATABASE_NAME}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - postgres-live-data:/var/lib/postgresql/data
    networks:
      - live-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 8
    security_opt:
      - no-new-privileges:true

  db-demo:
    image: esafe-database:${ESAFE_APP_VERSION:-dev}
    build:
      context: .
      dockerfile: infra/database/Dockerfile
    restart: unless-stopped
    shm_size: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DEMO_DATABASE_NAME}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - postgres-demo-data:/var/lib/postgresql/data
    networks:
      - demo-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 8
    security_opt:
      - no-new-privileges:true

  db-control:
    image: esafe-database:${ESAFE_APP_VERSION:-dev}
    build:
      context: .
      dockerfile: infra/database/Dockerfile
    restart: unless-stopped
    shm_size: 128m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${CONTROL_DATABASE_NAME:-esafe_control}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - postgres-control-data:/var/lib/postgresql/data
    networks:
      - ai-control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 8
    security_opt:
      - no-new-privileges:true

  redis-live:
    image: redis:8.0.1-bookworm
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-live-data:/data
    networks:
      - live-backend
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 8
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - SETGID
      - SETUID

  redis-demo:
    image: redis:8.0.1-bookworm
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-demo-data:/data
    networks:
      - demo-backend
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 8
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - SETGID
      - SETUID

  migrate-live:
    <<: *backend-common
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed"]
    environment:
      ESAFE_PROFILE: LIVE
      ESAFE_SESSION_SECRET: ${ESAFE_SESSION_SECRET_LIVE}
      ESAFE_PUBLIC_USER_ID: ${ESAFE_PUBLIC_USER_ID:-user}
      ESAFE_PUBLIC_USER_PASSWORD: ${ESAFE_PUBLIC_USER_PASSWORD}
      NFDS_ENABLED: ${NFDS_ENABLED:-true}
      NFDS_MONITOR_URL: ${NFDS_MONITOR_URL:-https://www.nfds.go.kr/dashboard/monitorData.do}
      KMA_WARNING_BASE_URL: ${KMA_WARNING_BASE_URL:-https://apis.data.go.kr/1360000/WthrWrnInfoService}
      DISASTER_MESSAGE_URL: ${DISASTER_MESSAGE_URL:-https://www.safetydata.go.kr/disaster-data/disasterNotification}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-live:5432/${LIVE_DATABASE_NAME}
    networks:
      - live-backend
    depends_on:
      db-live:
        condition: service_healthy

  migrate-demo:
    <<: *backend-common
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed"]
    environment:
      ESAFE_PROFILE: DEMO
      ESAFE_SESSION_SECRET: ${ESAFE_SESSION_SECRET_DEMO}
      ESAFE_PUBLIC_USER_ID: ${ESAFE_PUBLIC_USER_ID:-user}
      ESAFE_PUBLIC_USER_PASSWORD: ${ESAFE_PUBLIC_USER_PASSWORD}
      NFDS_ENABLED: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-demo:5432/${DEMO_DATABASE_NAME}
    networks:
      - demo-backend
    depends_on:
      db-demo:
        condition: service_healthy

  migrate-control:
    <<: *backend-common
    restart: "no"
    command: ["python", "-m", "app.cli", "init-ai-control"]
    environment:
      AI_CONTROL_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-control:5432/${CONTROL_DATABASE_NAME:-esafe_control}
      UPSTAGE_COST_HARD_STOP_USD: ${UPSTAGE_COST_HARD_STOP_USD:-450}
    networks:
      - ai-control
    depends_on:
      db-control:
        condition: service_healthy

  api-live:
    <<: *backend-common
    environment:
      ESAFE_PROFILE: LIVE
      ESAFE_APP_VERSION: ${ESAFE_APP_VERSION:-dev}
      ESAFE_BUILD_COMMIT: ${ESAFE_BUILD_COMMIT:-unknown}
      ESAFE_SESSION_SECRET: ${ESAFE_SESSION_SECRET_LIVE}
      ESAFE_COOKIE_SECURE: ${ESAFE_COOKIE_SECURE:-false}
      ESAFE_PUBLIC_ORIGINS: ${ESAFE_PUBLIC_ORIGINS:-http://127.0.0.1:8080}
      VWORLD_TILE_URL: ${VWORLD_TILE_URL:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-live:5432/${LIVE_DATABASE_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-live:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis-live:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis-live:6379/1
      CELERY_QUEUE: live
      LOG_LEVEL: INFO
    volumes:
      - ./storage/live:/srv/esafe/storage
      - ./storage/reference/source-documents/${RAG_SOURCE_SNAPSHOT:-initial-20260729}/derived/${RAG_DERIVED_VERSION:-rag-local-parser-v2-rag-privacy-ko-v2-rag-paragraph-chunker-v2}:/srv/esafe/reference/rag:ro
    networks:
      - live-backend
      - edge
    depends_on:
      db-live:
        condition: service_healthy
      migrate-live:
        condition: service_completed_successfully
      redis-live:
        condition: service_healthy
    healthcheck: *api-healthcheck

  api-demo:
    <<: *backend-common
    environment:
      ESAFE_PROFILE: DEMO
      ESAFE_APP_VERSION: ${ESAFE_APP_VERSION:-dev}
      ESAFE_BUILD_COMMIT: ${ESAFE_BUILD_COMMIT:-unknown}
      ESAFE_SESSION_SECRET: ${ESAFE_SESSION_SECRET_DEMO}
      ESAFE_COOKIE_SECURE: ${ESAFE_COOKIE_SECURE:-false}
      ESAFE_PUBLIC_ORIGINS: ${ESAFE_PUBLIC_ORIGINS:-http://127.0.0.1:8080}
      VWORLD_TILE_URL: ${VWORLD_TILE_URL:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-demo:5432/${DEMO_DATABASE_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-demo:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis-demo:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis-demo:6379/1
      CELERY_QUEUE: demo
      LOG_LEVEL: INFO
    volumes:
      - ./storage/demo:/srv/esafe/storage
      - ./storage/reference/source-documents/${RAG_SOURCE_SNAPSHOT:-initial-20260729}/derived/${RAG_DERIVED_VERSION:-rag-local-parser-v2-rag-privacy-ko-v2-rag-paragraph-chunker-v2}:/srv/esafe/reference/rag:ro
    networks:
      - demo-backend
      - edge
    depends_on:
      db-demo:
        condition: service_healthy
      migrate-demo:
        condition: service_completed_successfully
      redis-demo:
        condition: service_healthy
    healthcheck: *api-healthcheck

  worker-live:
    <<: *backend-common
    command:
      - celery
      - -A
      - app.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=live
      - --hostname=worker-live@%h
      - --concurrency=2
    environment:
      ESAFE_PROFILE: LIVE
      ESAFE_SESSION_SECRET: ${ESAFE_SESSION_SECRET_LIVE}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-live:5432/${LIVE_DATABASE_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-live:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis-live:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis-live:6379/1
      CELERY_QUEUE: live
      AI_CONTROL_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-control:5432/${CONTROL_DATABASE_NAME:-esafe_control}
      UPSTAGE_API_KEY: ${UPSTAGE_API_KEY}
      UPSTAGE_BASE_URL: ${UPSTAGE_BASE_URL:-https://api.upstage.ai/v1}
      UPSTAGE_CHAT_MODEL: ${UPSTAGE_CHAT_MODEL:-solar-pro3}
      UPSTAGE_EMBED_QUERY_MODEL: ${UPSTAGE_EMBED_QUERY_MODEL:-solar-embedding-2-query}
      UPSTAGE_EMBED_PASSAGE_MODEL: ${UPSTAGE_EMBED_PASSAGE_MODEL:-solar-embedding-2-passage}
      UPSTAGE_COST_HARD_STOP_USD: ${UPSTAGE_COST_HARD_STOP_USD:-450}
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY}
      NFDS_ENABLED: ${NFDS_ENABLED:-true}
      NFDS_MONITOR_URL: ${NFDS_MONITOR_URL:-https://www.nfds.go.kr/dashboard/monitorData.do}
      KMA_WARNING_BASE_URL: ${KMA_WARNING_BASE_URL:-https://apis.data.go.kr/1360000/WthrWrnInfoService}
      DISASTER_MESSAGE_URL: ${DISASTER_MESSAGE_URL:-https://www.safetydata.go.kr/disaster-data/disasterNotification}
    volumes:
      - ./storage/live:/srv/esafe/storage
      - ./storage/reference/source-documents/${RAG_SOURCE_SNAPSHOT:-initial-20260729}/derived/${RAG_DERIVED_VERSION:-rag-local-parser-v2-rag-privacy-ko-v2-rag-paragraph-chunker-v2}:/srv/esafe/reference/rag:ro
    networks:
      - live-backend
      - ai-control
      - outbound
    depends_on:
      db-live:
        condition: service_healthy
      migrate-live:
        condition: service_completed_successfully
      migrate-control:
        condition: service_completed_successfully
      redis-live:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app:celery_app inspect ping --timeout=5 | grep -q pong"]
      interval: 20s
      timeout: 10s
      start_period: 25s
      retries: 5

  worker-demo:
    <<: *backend-common
    command:
      - celery
      - -A
      - app.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=demo
      - --hostname=worker-demo@%h
      - --concurrency=2
    environment:
      ESAFE_PROFILE: DEMO
      ESAFE_SESSION_SECRET: ${ESAFE_SESSION_SECRET_DEMO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-demo:5432/${DEMO_DATABASE_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-demo:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis-demo:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis-demo:6379/1
      CELERY_QUEUE: demo
      AI_CONTROL_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-control:5432/${CONTROL_DATABASE_NAME:-esafe_control}
      UPSTAGE_API_KEY: ${UPSTAGE_API_KEY}
      UPSTAGE_BASE_URL: ${UPSTAGE_BASE_URL:-https://api.upstage.ai/v1}
      UPSTAGE_CHAT_MODEL: ${UPSTAGE_CHAT_MODEL:-solar-pro3}
      UPSTAGE_EMBED_QUERY_MODEL: ${UPSTAGE_EMBED_QUERY_MODEL:-solar-embedding-2-query}
      UPSTAGE_EMBED_PASSAGE_MODEL: ${UPSTAGE_EMBED_PASSAGE_MODEL:-solar-embedding-2-passage}
      UPSTAGE_COST_HARD_STOP_USD: ${UPSTAGE_COST_HARD_STOP_USD:-450}
      NFDS_ENABLED: "false"
    volumes:
      - ./storage/demo:/srv/esafe/storage
      - ./storage/reference/source-documents/${RAG_SOURCE_SNAPSHOT:-initial-20260729}/derived/${RAG_DERIVED_VERSION:-rag-local-parser-v2-rag-privacy-ko-v2-rag-paragraph-chunker-v2}:/srv/esafe/reference/rag:ro
    networks:
      - demo-backend
      - ai-control
      - outbound
    depends_on:
      db-demo:
        condition: service_healthy
      migrate-demo:
        condition: service_completed_successfully
      migrate-control:
        condition: service_completed_successfully
      redis-demo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app:celery_app inspect ping --timeout=5 | grep -q pong"]
      interval: 20s
      timeout: 10s
      start_period: 25s
      retries: 5

  document-worker-live:
    image: esafe-document:${ESAFE_APP_VERSION:-dev}
    build: *document-build
    restart: unless-stopped
    init: true
    user: "${ESAFE_HOST_UID:-1001}:${ESAFE_HOST_GID:-1001}"
    command:
      - celery
      - -A
      - app.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=live-documents
      - --hostname=document-worker-live@%h
      - --concurrency=1
    environment:
      ESAFE_PROFILE: LIVE
      ESAFE_BUILD_COMMIT: ${ESAFE_BUILD_COMMIT:-unknown}
      ESAFE_SESSION_SECRET: ${ESAFE_SESSION_SECRET_LIVE}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-live:5432/${LIVE_DATABASE_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-live:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis-live:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis-live:6379/1
      CELERY_QUEUE: live
      DOCUMENT_STORAGE_ROOT: /srv/esafe/storage/documents
      HOME: /tmp/esafe-home
    volumes:
      - ./storage/live:/srv/esafe/storage
    networks:
      - live-backend
    depends_on:
      db-live:
        condition: service_healthy
      migrate-live:
        condition: service_completed_successfully
      redis-live:
        condition: service_healthy
    shm_size: 512m
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.celery_app:celery_app inspect ping --timeout=5
          --destination=document-worker-live@$$HOSTNAME | grep -q pong
      interval: 20s
      timeout: 10s
      start_period: 35s
      retries: 5

  document-worker-demo:
    image: esafe-document:${ESAFE_APP_VERSION:-dev}
    build: *document-build
    restart: unless-stopped
    init: true
    user: "${ESAFE_HOST_UID:-1001}:${ESAFE_HOST_GID:-1001}"
    command:
      - celery
      - -A
      - app.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=demo-documents
      - --hostname=document-worker-demo@%h
      - --concurrency=1
    environment:
      ESAFE_PROFILE: DEMO
      ESAFE_BUILD_COMMIT: ${ESAFE_BUILD_COMMIT:-unknown}
      ESAFE_SESSION_SECRET: ${ESAFE_SESSION_SECRET_DEMO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-demo:5432/${DEMO_DATABASE_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-demo:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis-demo:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis-demo:6379/1
      CELERY_QUEUE: demo
      DOCUMENT_STORAGE_ROOT: /srv/esafe/storage/documents
      HOME: /tmp/esafe-home
    volumes:
      - ./storage/demo:/srv/esafe/storage
    networks:
      - demo-backend
    depends_on:
      db-demo:
        condition: service_healthy
      migrate-demo:
        condition: service_completed_successfully
      redis-demo:
        condition: service_healthy
    shm_size: 512m
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.celery_app:celery_app inspect ping --timeout=5
          --destination=document-worker-demo@$$HOSTNAME | grep -q pong
      interval: 20s
      timeout: 10s
      start_period: 35s
      retries: 5

  scheduler-live:
    <<: *backend-common
    command:
      - celery
      - -A
      - app.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/srv/esafe/storage/scheduler/celerybeat-schedule
    environment:
      ESAFE_PROFILE: LIVE
      ESAFE_SESSION_SECRET: ${ESAFE_SESSION_SECRET_LIVE}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-live:5432/${LIVE_DATABASE_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-live:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis-live:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis-live:6379/1
      CELERY_QUEUE: live
      NFDS_ENABLED: ${NFDS_ENABLED:-true}
      NFDS_MONITOR_URL: ${NFDS_MONITOR_URL:-https://www.nfds.go.kr/dashboard/monitorData.do}
      KMA_WARNING_BASE_URL: ${KMA_WARNING_BASE_URL:-https://apis.data.go.kr/1360000/WthrWrnInfoService}
      DISASTER_MESSAGE_URL: ${DISASTER_MESSAGE_URL:-https://www.safetydata.go.kr/disaster-data/disasterNotification}
    volumes:
      - ./storage/live:/srv/esafe/storage
    networks:
      - live-backend
      - outbound
    depends_on:
      worker-live:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /srv/esafe/storage/scheduler/celerybeat-schedule"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 5

  scheduler-demo:
    <<: *backend-common
    command:
      - celery
      - -A
      - app.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/srv/esafe/storage/scheduler/celerybeat-schedule
    environment:
      ESAFE_PROFILE: DEMO
      ESAFE_SESSION_SECRET: ${ESAFE_SESSION_SECRET_DEMO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-demo:5432/${DEMO_DATABASE_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-demo:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis-demo:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis-demo:6379/1
      CELERY_QUEUE: demo
      NFDS_ENABLED: "false"
    volumes:
      - ./storage/demo:/srv/esafe/storage
    networks:
      - demo-backend
    depends_on:
      worker-demo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /srv/esafe/storage/scheduler/celerybeat-schedule"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 5

  import-live:
    <<: *importer-common
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-live:5432/${LIVE_DATABASE_NAME}
      REFERENCE_ROOT: /reference
      REFERENCE_IMPORT_ID: ${REFERENCE_IMPORT_ID}
      ADMIN_BOUNDARY_SNAPSHOT: ${ADMIN_BOUNDARY_SNAPSHOT}
    networks:
      - live-backend
    depends_on:
      db-live:
        condition: service_healthy
      migrate-live:
        condition: service_completed_successfully

  import-demo:
    <<: *importer-common
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-demo:5432/${DEMO_DATABASE_NAME}
      REFERENCE_ROOT: /reference
      REFERENCE_IMPORT_ID: ${REFERENCE_IMPORT_ID}
      ADMIN_BOUNDARY_SNAPSHOT: ${ADMIN_BOUNDARY_SNAPSHOT}
    networks:
      - demo-backend
    depends_on:
      db-demo:
        condition: service_healthy
      migrate-demo:
        condition: service_completed_successfully

  import-similarity-live:
    <<: *importer-common
    entrypoint: ["python", "-m", "esafe_importer.similarity"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-live:5432/${LIVE_DATABASE_NAME}
      REFERENCE_ROOT: /reference
      REFERENCE_IMPORT_ID: ${REFERENCE_IMPORT_ID}
      ADMIN_BOUNDARY_SNAPSHOT: ${ADMIN_BOUNDARY_SNAPSHOT}
    networks:
      - live-backend
    depends_on:
      db-live:
        condition: service_healthy
      migrate-live:
        condition: service_completed_successfully

  import-similarity-demo:
    <<: *importer-common
    entrypoint: ["python", "-m", "esafe_importer.similarity"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-demo:5432/${DEMO_DATABASE_NAME}
      REFERENCE_ROOT: /reference
      REFERENCE_IMPORT_ID: ${REFERENCE_IMPORT_ID}
      ADMIN_BOUNDARY_SNAPSHOT: ${ADMIN_BOUNDARY_SNAPSHOT}
    networks:
      - demo-backend
    depends_on:
      db-demo:
        condition: service_healthy
      migrate-demo:
        condition: service_completed_successfully

  rag-source-build:
    <<: *importer-common
    entrypoint: ["python", "-m", "esafe_importer.rag_sources"]
    command:
      - build
      - --snapshot-root
      - /reference/source-documents/${RAG_SOURCE_SNAPSHOT:-initial-20260729}
    volumes:
      - ./storage/reference:/reference
    network_mode: "none"

  rag-embedding-build:
    <<: *backend-common
    profiles: ["tools"]
    restart: "no"
    command: ["python", "-m", "app.cli", "build-rag-embeddings"]
    environment:
      ESAFE_PROFILE: LIVE
      ESAFE_SESSION_SECRET: ${ESAFE_SESSION_SECRET_LIVE}
      AI_CONTROL_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-control:5432/${CONTROL_DATABASE_NAME:-esafe_control}
      UPSTAGE_API_KEY: ${UPSTAGE_API_KEY}
      UPSTAGE_BASE_URL: ${UPSTAGE_BASE_URL:-https://api.upstage.ai/v1}
      UPSTAGE_EMBED_PASSAGE_MODEL: ${UPSTAGE_EMBED_PASSAGE_MODEL:-solar-embedding-2-passage}
      UPSTAGE_COST_HARD_STOP_USD: ${UPSTAGE_COST_HARD_STOP_USD:-450}
      RAG_DERIVED_ROOT: /srv/esafe/reference/rag
      RAG_EMBEDDING_OUTPUT_ROOT: /srv/esafe/reference/rag-embeddings
    volumes:
      - ./storage/reference/source-documents/${RAG_SOURCE_SNAPSHOT:-initial-20260729}/derived/${RAG_DERIVED_VERSION:-rag-local-parser-v2-rag-privacy-ko-v2-rag-paragraph-chunker-v2}:/srv/esafe/reference/rag:ro
      - ./storage/reference/rag-embeddings:/srv/esafe/reference/rag-embeddings
    networks:
      - ai-control
      - outbound
    depends_on:
      db-control:
        condition: service_healthy
      migrate-control:
        condition: service_completed_successfully

  import-rag-live:
    <<: *importer-common
    entrypoint: ["python", "-m", "esafe_importer.rag_index"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-live:5432/${LIVE_DATABASE_NAME}
      RAG_DERIVED_ROOT: /reference/rag
    volumes:
      - ./storage/reference/source-documents/${RAG_SOURCE_SNAPSHOT:-initial-20260729}/derived/${RAG_DERIVED_VERSION:-rag-local-parser-v2-rag-privacy-ko-v2-rag-paragraph-chunker-v2}:/reference/rag:ro
    networks:
      - live-backend
    depends_on:
      db-live:
        condition: service_healthy
      migrate-live:
        condition: service_completed_successfully

  import-rag-demo:
    <<: *importer-common
    entrypoint: ["python", "-m", "esafe_importer.rag_index"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-demo:5432/${DEMO_DATABASE_NAME}
      RAG_DERIVED_ROOT: /reference/rag
    volumes:
      - ./storage/reference/source-documents/${RAG_SOURCE_SNAPSHOT:-initial-20260729}/derived/${RAG_DERIVED_VERSION:-rag-local-parser-v2-rag-privacy-ko-v2-rag-paragraph-chunker-v2}:/reference/rag:ro
    networks:
      - demo-backend
    depends_on:
      db-demo:
        condition: service_healthy
      migrate-demo:
        condition: service_completed_successfully

  import-rag-embeddings-live:
    <<: *importer-common
    entrypoint: ["python", "-m", "esafe_importer.rag_embeddings"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-live:5432/${LIVE_DATABASE_NAME}
      RAG_EMBEDDING_BUNDLE_ROOT: /reference/rag-embeddings
    volumes:
      - ./storage/reference/rag-embeddings:/reference/rag-embeddings:ro
    networks:
      - live-backend
    depends_on:
      db-live:
        condition: service_healthy
      migrate-live:
        condition: service_completed_successfully

  import-rag-embeddings-demo:
    <<: *importer-common
    entrypoint: ["python", "-m", "esafe_importer.rag_embeddings"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-demo:5432/${DEMO_DATABASE_NAME}
      RAG_EMBEDDING_BUNDLE_ROOT: /reference/rag-embeddings
    volumes:
      - ./storage/reference/rag-embeddings:/reference/rag-embeddings:ro
    networks:
      - demo-backend
    depends_on:
      db-demo:
        condition: service_healthy
      migrate-demo:
        condition: service_completed_successfully

  backup-scheduler:
    image: esafe-database:${ESAFE_APP_VERSION:-dev}
    restart: unless-stopped
    init: true
    user: "${ESAFE_HOST_UID:-1001}:${ESAFE_HOST_GID:-1001}"
    command: ["sh", "/opt/esafe/scripts/backup-loop.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LIVE_DATABASE_NAME: ${LIVE_DATABASE_NAME}
      DEMO_DATABASE_NAME: ${DEMO_DATABASE_NAME}
      CONTROL_DATABASE_NAME: ${CONTROL_DATABASE_NAME:-esafe_control}
      ESAFE_BUILD_COMMIT: ${ESAFE_BUILD_COMMIT:-unknown}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./scripts:/opt/esafe/scripts:ro
      - ./storage/live:/source/live:ro
      - ./storage/demo:/source/demo:ro
      - ./storage/reference:/source/reference:ro
      - ./backups:/backups
    networks:
      - live-backend
      - demo-backend
      - ai-control
    depends_on:
      db-live:
        condition: service_healthy
      db-demo:
        condition: service_healthy
      db-control:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /backups/runtime/backup-loop.ready
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  gateway:
    image: esafe-gateway:${ESAFE_APP_VERSION:-dev}
    build:
      context: .
      dockerfile: infra/gateway/Dockerfile
      args:
        ESAFE_BUILD_COMMIT: ${ESAFE_BUILD_COMMIT:-unknown}
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:8080
    networks:
      - edge
    depends_on:
      api-live:
        condition: service_healthy
      api-demo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

networks:
  live-backend:
    internal: true
  demo-backend:
    internal: true
  edge:
  outbound:
  ai-control:
    internal: true

volumes:
  postgres-live-data:
  postgres-demo-data:
  postgres-control-data:
  redis-live-data:
  redis-demo-data:
