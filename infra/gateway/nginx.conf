user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 25m;

  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 3s;
  upstream esafe_api_live {
    zone esafe_api_live 64k;
    server api-live:8000 resolve;
    keepalive 16;
  }
  upstream esafe_api_demo {
    zone esafe_api_demo 64k;
    server api-demo:8000 resolve;
    keepalive 16;
  }

  log_format structured escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time}';
  access_log /var/log/nginx/access.log structured;
  error_log /var/log/nginx/error.log warn;

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  map $http_cf_connecting_ip $esafe_client_ip {
    default $remote_addr;
    "~^[0-9a-fA-F:.]{3,45}$" $http_cf_connecting_ip;
  }

  gzip on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' http://oapi.map.naver.com https://oapi.map.naver.com http://apis.naver.com https://apis.naver.com http://*.map.naver.net https://*.map.naver.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://*.naver.net https://*.naver.net http://*.naver.com https://*.naver.com http://*.pstatic.net https://*.pstatic.net https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://xdworld.vworld.kr; connect-src 'self' http://*.naver.net https://*.naver.net http://*.naver.com https://*.naver.com http://*.pstatic.net https://*.pstatic.net https://kr-col-ext.nelo.navercorp.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://xdworld.vworld.kr; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location = / {
      return 302 /demo/;
    }

    location = /live/api/v1/health/ready { return 404; }
    location = /demo/api/v1/health/ready { return 404; }

    location ^~ /live/api/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://esafe_api_live/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $esafe_client_ip;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header Server;
      add_header Cache-Control "no-store" always;
      proxy_connect_timeout 5s;
      proxy_read_timeout 120s;
    }

    location ^~ /demo/api/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://esafe_api_demo/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $esafe_client_ip;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header Server;
      add_header Cache-Control "no-store" always;
      proxy_connect_timeout 5s;
      proxy_read_timeout 120s;
    }

    location ~* ^/assets/.*\.(css|js|map)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location ^~ /live/ {
      try_files $uri $uri/ /live/index.html;
    }

    location ^~ /demo/ {
      try_files $uri $uri/ /demo/index.html;
    }
  }
}
